<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="weather-info">
      <form id="submit-form" action="submit">

          id="input-text"
          type="text"
          name="city"

    </div>
    <script src="script.js"></script>
  </body>
</html>
